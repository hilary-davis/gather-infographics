<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gather Infographics Tool</title>

<!-- Merriweather (brand serif). Arial is a system font. -->


<link href="fonts/fonts.css" rel="stylesheet" />

<!-- Carbon Charts styles -->
<link rel="stylesheet" href="vendor/carbon-charts.css" />

<style>
  :root {
    /* Gather Signal palette */
    --dark-orange: #980000;
    --orange:      #EE4B22;
    --orange-80:   #F16F4E;
    --orange-60:   #F5937A;
    --orange-40:   #F8B7A7;
    --orange-20:   #FCDBD3;
    --impact-black:#404040;
    --better-gray: #A5A5A5;
    --indep-white: #F3F3F3;
    --pure-white:  #FFFFFF;
    --signal-blue: #64A4E9;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: var(--impact-black);
    background: var(--pure-white);
    display: grid;
    grid-template-columns: 380px 1fr;
    min-height: 100vh;
  }

  /* ---------- Controls panel ---------- */
  .panel {
    background: var(--indep-white);
    border-right: 1px solid #e2e2e2;
    padding: 24px 22px 60px;
    overflow-y: auto;
    height: 100vh;
  }
  .panel h1 {
    font-family: 'Merriweather', serif;
    font-weight: 300;
    font-size: 20px;
    margin: 0 0 2px;
  }
  .panel .sub {
    font-size: 11px;
    color: var(--better-gray);
    margin: 0 0 22px;
    line-height: 1.4;
  }
  .field { margin-bottom: 18px; }
  .field > label {
    display: block;
    font-family: Arial, sans-serif;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: 6px;
  }
  input[type="text"], textarea, select {
    width: 100%;
    padding: 8px 9px;
    border: 1px solid #d3d3d3;
    border-radius: 4px;
    font-family: Arial, sans-serif;
    font-size: 13px;
    color: var(--impact-black);
    background: var(--pure-white);
  }
  textarea { resize: vertical; min-height: 64px; line-height: 1.4; }
  select { cursor: pointer; }

  .type-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .type-grid button {
    font-family: Arial, sans-serif;
    font-size: 11px;
    font-weight: 700;
    padding: 9px 4px;
    border: 1px solid #d3d3d3;
    border-radius: 4px;
    background: var(--pure-white);
    color: var(--impact-black);
    cursor: pointer;
    transition: all .12s ease;
  }
  .type-grid button:hover { border-color: var(--orange-60); }
  .type-grid button.active {
    background: var(--orange);
    border-color: var(--orange);
    color: var(--pure-white);
  }

  /* data rows */
  .rows { display: flex; flex-direction: column; gap: 6px; }
  .row {
    display: grid;
    grid-template-columns: 1fr 78px 26px 26px;
    gap: 5px;
    align-items: center;
  }
  .row input { padding: 6px 8px; font-size: 12px; }
  .row .hl, .row .del {
    border: 1px solid #d3d3d3;
    background: var(--pure-white);
    border-radius: 4px;
    height: 30px;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 0;
    color: var(--better-gray);
  }
  .series-row { display: grid; grid-template-columns: 1fr 30px; gap: 5px; margin-bottom: 6px; }
  .series-row .hl {
    border: 1px solid #d3d3d3;
    background: var(--pure-white);
    border-radius: 4px;
    height: 30px;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 0;
    color: var(--better-gray);
  }
  .series-row .hl.on, .row .hl.on {
    background: var(--signal-blue);
    border-color: var(--signal-blue);
    color: #fff;
  }
  .row .del:hover { color: var(--dark-orange); border-color: var(--dark-orange); }
  .mini-btn {
    margin-top: 8px;
    font-family: Arial, sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: .04em;
    background: none;
    border: 1px dashed var(--better-gray);
    color: var(--impact-black);
    border-radius: 4px;
    padding: 7px;
    width: 100%;
    cursor: pointer;
  }
  .mini-btn:hover { border-color: var(--orange); color: var(--orange); }
  .hint { font-size: 10.5px; color: var(--better-gray); margin-top: 6px; line-height: 1.4; }

  .toggle-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--impact-black);
  }
  .download {
    width: 100%;
    margin-top: 8px;
    background: var(--dark-orange);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 13px;
    font-family: Arial, sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .04em;
    cursor: pointer;
  }
  .download:hover { background: #7e0000; }

  /* ---------- Preview / card ---------- */
  .stage {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px;
    overflow: auto;
    height: 100vh;
  }
  .card-scaler { transform-origin: top center; }

  /* THE EXPORT TARGET */
  #card {
    width: 1000px;
    background: var(--indep-white);
    padding: 56px;                 /* outer card padding (tightened per mockup) */
    font-family: Arial, sans-serif;
  }
  #card .cat {
    font-family: Arial, sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--orange);
    margin: 0 0 22px;
  }
  #card .title {
    font-family: 'Merriweather', serif;
    font-weight: 300;
    font-size: 40px;
    line-height: 1.2;
    color: var(--impact-black);
    margin: 0 0 8px;
  }
  #card .subtitle {
    font-family: 'Merriweather', serif;
    font-weight: 300;
    font-size: 19px;
    line-height: 1.35;
    color: var(--impact-black);
    margin: 0 0 12px;
  }
  #chart-holder {
    width: 100%;
    height: auto;              /* grows to fit chart + axis title + legend */
    position: relative;
    margin-top: 56px;          /* breathing room between title and chart */
    /* point Carbon's font at Merriweather */
    --cds-charts-font-family: Arial, Helvetica, sans-serif;
    --cds-charts-font-family-condensed: Arial, Helvetica, sans-serif;
  }
  /* Carbon Charts reads these design tokens for backgrounds, axes, and text.
     Without them it falls back to a black plot area. Map them to Signal. */
  #card {
    --cds-background: #F3F3F3;           /* plot area = Independent White (seamless) */
    --cds-layer-01: #F3F3F3;
    --cds-layer-accent-01: #E4E4E4;
    --cds-text-primary: #404040;         /* Impact Black labels */
    --cds-text-secondary: #404040;
    --cds-border-strong-01: #8A8A8A;     /* axis domain lines (path.domain) */
    --cds-border-subtle-selected-01: #C0C0C0; /* selected-tick borders (NOT the grid) */
    /* NOTE: grid lines read --cds-layer-accent-01, and are overridden explicitly
       further down — see the "chart line weights" block. */
    --cds-focus: #EE4B22;
  }
  /* Stat-callout (non-Carbon) — up to three stats in a row */
  #stat {
    display: none;
    margin-top: 56px;
    padding: 10px 0 6px;
    gap: 44px;
    align-items: flex-start;
  }
  .stat-tile { flex: 1 1 0; min-width: 0; }
  .stat-tile.solo { flex: 0 1 auto; }
  .stat-big {
    font-family: 'Merriweather', serif;
    font-weight: 700;
    line-height: 1;
    color: var(--dark-orange);
    margin: 0;
    letter-spacing: -0.02em;
  }
  .stat-big.blue { color: var(--signal-blue); }
  .stat-label {
    font-family: Arial, sans-serif;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--impact-black);
    margin: 12px 0 0;
    line-height: 1.25;
  }
  #card .footer {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-top: 44px;
    padding-top: 0;
    gap: 20px;
  }
  #card .source {
    font-family: Arial, sans-serif;
    font-size: 14px;
    color: var(--better-gray);
    margin: 0;
    line-height: 1.4;
  }
  #card .wordmark { height: 34px; flex: none; }
  #card .wordmark img { height: 100%; display: block; }
  #card .wordmark.hidden { display: none; }

  /* Hide Carbon's default toolbar entirely */
  .cds--cc--toolbar { display: none !important; }
  /* Axis titles: match the gray of the data (tick) labels, normal weight
     (the ALL-CAPS comes from uppercasing the text itself). */
  #card .axis-title { fill: #525252; font-weight: 400; }
  /* Carbon's axis text defaults to "IBM Plex Sans Condensed", which is installed
     almost nowhere — so it silently substituted a different font (and different
     metrics) in the browser and again in Illustrator. Pin it to the brand label font. */
  #card .axis text, #card .cds--cc--axes text { font-family: Arial, Helvetica, sans-serif; }
  /* Nothing inside the Carbon chart should request a non-brand font. (The
     hand-drawn pie/donut sits outside .cds--chart-holder and keeps Merriweather
     for its centre figure.) */
  #card .cds--chart-holder, #card .cds--chart-holder * { font-family: Arial, Helvetica, sans-serif; }
  /* Data (tick) labels: bump to 16px (Carbon body-02) for mobile legibility.
     Export inlines each node's computed font-size, so this carries into the PNG. */
  #card .axis .tick text { font-size: 16px !important; }

  /* ---------- chart line weights ----------
     Background grid lines: Carbon defaults to 1px in --cds-layer-accent-01
     (#e0e0e0). Overridden here to be darker and set to an explicit weight.
     The export inlines computed styles, so these carry into the PNG. */
  #card .cds--cc--grid g.x.grid g.tick line,
  #card .cds--cc--grid g.y.grid g.tick line {
    stroke: #A5A5A5 !important;      /* Better Gray — darker, was ~#E0E0E0 */
    stroke-width: 1px !important;    /* Carbon default weight — darker, not thicker */
  }
  /* Data lines on the line & area charts (Carbon default 1.5) */
  #card path.line {
    stroke-width: 3px !important;
  }
  /* Point markers on the line chart — outline matches the line weight.
     Carbon draws these via the scatter component (circle.dot, default 1.5). */
  #card circle.dot {
    stroke-width: 3px !important;
  }

  /* ---------- Mobile / narrow screens ----------
     Desktop keeps the side-by-side layout. Below 900px the two columns stack
     (preview first, controls under it) and the fixed 100vh heights are dropped
     so the page scrolls normally instead of trapping content off-screen. */
  @media (max-width: 900px) {
    body {
      grid-template-columns: 1fr;   /* single column */
      min-height: 0;
    }
    .stage {
      order: -1;                    /* preview above the controls */
      height: auto;                 /* was 100vh — let it grow */
      padding: 16px;
      overflow-x: auto;
      border-bottom: 1px solid #e2e2e2;
    }
    .panel {
      height: auto;                 /* was 100vh */
      overflow-y: visible;
      border-right: none;
      padding: 20px 16px 48px;
    }
    .card-scaler { transform-origin: top left; }
    /* inputs at 16px stop iOS from auto-zooming the page on focus */
    .row input, .panel input[type="text"], .panel textarea { font-size: 16px; }
  }
</style>
</head>
<body>

  <!-- ===================== CONTROLS ===================== -->
  <aside class="panel">
    <h1>Gather Infographics Tool</h1>
    <p class="sub">Make an on-brand chart, download a PNG</p>

    <div class="field">
      <label>Chart type</label>
      <div class="type-grid" id="type-grid">
        <button data-type="bar" class="active">Bar</button>
        <button data-type="barh">Bar (horiz.)</button>
        <button data-type="line">Line</button>
        <button data-type="pie">Pie</button>
        <button data-type="donut">Donut</button>
        <button data-type="area">Area</button>
        <button data-type="stat">Stat</button>
      </div>
    </div>

    <div class="field">
      <label>Category label <span style="color:var(--better-gray);font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
      <input type="text" id="in-cat" placeholder="e.g. EPISODE 12 · BY THE NUMBERS" />
    </div>

    <div class="field">
      <label>Title</label>
      <input type="text" id="in-title" placeholder="Where Gatherers spend their week" />
    </div>

    <div class="field">
      <label>Subtitle <span style="color:var(--better-gray);font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
      <input type="text" id="in-subtitle" placeholder="One line of context under the title" />
    </div>

    <div class="field" id="axis-field">
      <label>Axis labels <span style="color:var(--better-gray);font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
      <input type="text" id="in-xaxis" placeholder="Horizontal axis — e.g. Quarter, Years" style="margin-bottom:6px;" />
      <input type="text" id="in-yaxis" placeholder="Vertical axis — e.g. Dollars, %" />
    </div>

    <div class="field" id="compare-field">
      <label>Data sets <span style="color:var(--better-gray);font-weight:400;text-transform:none;letter-spacing:0">(bar &amp; line)</span></label>
      <select id="in-seriescount">
        <option value="1">1 — single set</option>
        <option value="2">2 — compare two</option>
        <option value="3">3 — compare three</option>
        <option value="4">4 — compare four</option>
      </select>
      <div id="series-names" style="display:none;margin-top:8px;">
        <div class="series-row" id="srow1"><input type="text" id="in-series1" placeholder="Set 1 name" /><button class="hl" id="hl-series1" title="Make this set Signal Blue">&#9670;</button></div>
        <div class="series-row" id="srow2"><input type="text" id="in-series2" placeholder="Set 2 name" /><button class="hl" id="hl-series2" title="Make this set Signal Blue">&#9670;</button></div>
        <div class="series-row" id="srow3"><input type="text" id="in-series3" placeholder="Set 3 name" /><button class="hl" id="hl-series3" title="Make this set Signal Blue">&#9670;</button></div>
        <div class="series-row" id="srow4"><input type="text" id="in-series4" placeholder="Set 4 name" /><button class="hl" id="hl-series4" title="Make this set Signal Blue">&#9670;</button></div>
      </div>
      <p class="hint">Click ◈ to make one set Signal Blue.</p>
    </div>

    <div class="field">
      <label>Data</label>
      <p class="hint" id="data-hint" style="margin-top:0;margin-bottom:8px;">Click the ◈ on a row to highlight that one point in Signal Blue. (Bar, pie, donut &amp; stat.)</p>
      <div class="rows" id="rows"></div>
      <button class="mini-btn" id="add-row">+ Add row</button>
    </div>

    <div class="field">
      <label>Paste from a spreadsheet <span style="color:var(--better-gray);font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
      <textarea id="in-paste" placeholder="Paste cells straight from a spreadsheet &#8212; header row and up to 4 number columns.&#10;Region	Q1	Q2	Q3	Q4&#10;North	42,000	47,500	51,200	60,300"></textarea>
      <button class="mini-btn" id="apply-paste">Fill rows from paste</button>
      <p class="hint" id="paste-note"></p>
    </div>

    <div class="field">
      <label>Source line <span style="color:var(--better-gray);font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
      <input type="text" id="in-source" placeholder="Source: Gather Signal listener survey, 2026" />
    </div>

    <div class="field">
      <label>Export</label>
      <button class="download" id="download">Download PNG</button>
      <button class="download" id="download-svg" style="margin-top:8px;background:var(--impact-black);">Download SVG</button>
      <p class="hint" id="export-note"></p>
    </div>
  </aside>

  <!-- ===================== PREVIEW ===================== -->
  <main class="stage">
    <div class="card-scaler" id="scaler">
      <div id="card">
        <p class="cat" id="c-cat"></p>
        <h2 class="title" id="c-title"></h2>
        <p class="subtitle" id="c-subtitle"></p>

        <div id="chart-holder"></div>

        <div id="stat"></div>

        <div class="footer">
          <p class="source" id="c-source"></p>
          <div class="wordmark" id="c-wordmark">
            <img src="assets/signal-wordmark-black.png" alt="Gather Signal wordmark"
                 onerror="this.parentNode.dataset.missing='1'; this.remove();" />
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Carbon Charts (UMD → window.Charts). d3 is bundled in this build. -->
  <script src="vendor/carbon-charts.umd.js"></script>
  <!-- html-to-image (UMD → window.htmlToImage) -->
  <script src="vendor/html-to-image.js"></script>

  <script>
  (function () {
    "use strict";

    var RAMP = ["#980000", "#EE4B22", "#F16F4E", "#F5937A", "#F8B7A7", "#FCDBD3"];
    // stat tiles step: Dark Orange -> Progress Orange -> Progress Orange 60
    var STAT_RAMP = ["#980000", "#EE4B22", "#F5937A"];
    var SIGNAL_BLUE = "#64A4E9";
    var ORANGE = "#EE4B22";

    var state = {
      type: "bar",
      cat: "",
      title: "Where Gatherers spend their week",
      subtitle: "",
      source: "",
      wordmark: true,        /* always on — the toggle was removed from the UI */
      highlight: -1,
      seriesCount: 1,
      seriesHighlight: -1,
      seriesNames: ["Q1", "Q2", "Q3", "Q4"],
      xAxis: "",
      yAxis: "",
      rows: [
        { label: "Design", vals: [42, 36, 0, 0] },
        { label: "Data", vals: [28, 22, 0, 0] },
        { label: "Ops", vals: [17, 20, 0, 0] },
        { label: "Content", vals: [13, 15, 0, 0] }
      ]
    };

    // up to four comparison sets. First two keep the original orange/blue pairing.
    var MAX_SERIES = 4;
    // 2 sets = the orange/blue contrast pair. 3-4 sets step through the tint ramp
    // (sequential data like quarters reads better as a progression), with Signal
    // Blue anchoring the last set.
    function seriesPalette(n) {
      if (n <= 2) return ["#EE4B22", "#64A4E9"];
      if (n === 3) return ["#980000", "#EE4B22", "#F5937A"];
      return ["#980000", "#EE4B22", "#F5937A", "#F8B7A7"];
    }
    function seriesColor(i) {
      if (i === state.seriesHighlight) return SIGNAL_BLUE;   // ◈ toggle
      var p = seriesPalette(nSeries());
      return p[i % p.length];
    }
    function sName(i) { return (state.seriesNames[i] || "").trim() || ("Set " + (i + 1)); }
    function seriesCount() { return Math.max(1, Math.min(MAX_SERIES, state.seriesCount || 1)); }
    function compareAllowed() { return ["bar", "barh", "line"].indexOf(state.type) !== -1; }
    function comparing() { return seriesCount() > 1 && compareAllowed(); }
    function nSeries() { return comparing() ? seriesCount() : 1; }
    function rowVal(r, i) { var v = (r.vals || [])[i]; v = parseFloat(v); return isNaN(v) ? 0 : v; }

    var chart = null;
    var $ = function (id) { return document.getElementById(id); };

    /* ---------- data rows UI ---------- */
    function renderRows() {
      var wrap = $("rows");
      wrap.innerHTML = "";
      var n = nSeries();
      var cmp = comparing();
      var vw = n >= 4 ? 42 : (n === 3 ? 50 : (n === 2 ? 58 : 78));
      state.rows.forEach(function (r, i) {
        if (!r.vals) r.vals = [0, 0, 0, 0];
        var row = document.createElement("div");
        row.className = "row";
        row.style.gridTemplateColumns = "1fr " + new Array(n + 1).join(vw + "px ") +
          (cmp ? "26px" : "26px 26px");

        var lab = document.createElement("input");
        lab.type = "text"; lab.value = r.label; lab.placeholder = "Label";
        lab.oninput = function () { state.rows[i].label = lab.value; render(); };
        row.appendChild(lab);

        for (var k = 0; k < n; k++) {
          (function (k) {
            var val = document.createElement("input");
            val.type = "text";
            val.value = (r.vals[k] == null ? "" : r.vals[k]);
            val.placeholder = "0";
            if (cmp) val.title = sName(k);
            val.oninput = function () {
              var num = parseFloat(val.value.replace(/[^0-9.\-]/g, ""));
              state.rows[i].vals[k] = isNaN(num) ? 0 : num; render();
            };
            row.appendChild(val);
          })(k);
        }

        if (!cmp) {
          var hl = document.createElement("button");
          hl.className = "hl" + (state.highlight === i ? " on" : "");
          hl.title = "Highlight in Signal Blue";
          hl.innerHTML = "&#9670;";
          hl.onclick = function () {
            state.highlight = (state.highlight === i) ? -1 : i; renderRows(); render();
          };
          row.appendChild(hl);
        }

        var del = document.createElement("button");
        del.className = "del"; del.title = "Remove row"; del.innerHTML = "&times;";
        del.onclick = function () {
          state.rows.splice(i, 1);
          if (state.highlight === i) state.highlight = -1;
          else if (state.highlight > i) state.highlight--;
          renderRows(); render();
        };
        row.appendChild(del);
        wrap.appendChild(row);
      });
    }

    /* ---------- colour scale ---------- */
    function colorScaleByLabel() {
      var scale = {};
      state.rows.forEach(function (r, i) {
        scale[r.label] = (i === state.highlight) ? SIGNAL_BLUE : RAMP[i % RAMP.length];
      });
      return scale;
    }

    /* apply the horizontal/vertical axis titles onto Carbon axes (bottom = horizontal,
       left = vertical), regardless of chart orientation */
    // Axis titles and the comparison legend are drawn as our own HTML overlays (see
    // render()), so Carbon renders only the plot + ticks. HTML overlays never get
    // clipped in the PNG and give exact control over spacing, ALL CAPS, colour, and
    // alignment. So Carbon itself gets no axis titles.
    function applyAxisTitles(axes) { return axes; }

    // One gap value for BOTH axis titles, and the title band thickness.
    var AXIS_GAP = 32;
    var AXIS_TITLE_H = 14;

    // Align the HTML overlays (x-axis title + legend) to the plot's left edge — the
    // X-axis vertical line — measured from Carbon's grid backdrop after it renders.
    function alignCartesianOverlays(holder) {
      var backdrop = holder.querySelector(".chart-grid-backdrop rect") ||
                     holder.querySelector(".chart-grid-backdrop");
      if (!backdrop) return;
      var bb = backdrop.getBoundingClientRect();
      // offsets are measured against each overlay's OWN box, so the left gutter
      // (holder padding) is never counted twice
      var xt = holder.querySelector(".ov-xtitle");
      if (xt) {
        var xr = xt.getBoundingClientRect();
        xt.style.paddingLeft = Math.max(0, Math.round(bb.left - xr.left)) + "px";
        xt.style.paddingRight = Math.max(0, Math.round(xr.right - bb.right)) + "px";
      }
      var lg = holder.querySelector(".ov-legend");
      if (lg) {
        var lr = lg.getBoundingClientRect();
        lg.style.paddingLeft = Math.max(0, Math.round(bb.left - lr.left)) + "px";
      }

      // Vertical title: sit exactly AXIS_GAP to the left of the value labels, so the
      // gap matches the horizontal title's gap instead of being centred in the gutter.
      var yt = holder.querySelector(".ov-ytitle");
      if (yt) {
        // NOTE: Carbon keeps a hidden duplicate set of tick labels for measurement,
        // so take the VISIBLE set — the one whose right edge sits nearest the plot.
        var rects = [];
        Array.prototype.forEach.call(
          holder.querySelectorAll(".axis.left .tick text"),
          function (t) {
            var r = t.getBoundingClientRect();
            if (r.width > 0 && r.right <= bb.left + 1) rects.push(r);
          }
        );
        if (rects.length) {
          var maxRight = -Infinity;
          rects.forEach(function (r) { maxRight = Math.max(maxRight, r.right); });
          var minLeft = Infinity;
          rects.forEach(function (r) {
            if (r.right >= maxRight - 2) minLeft = Math.min(minLeft, r.left);
          });
          var hl = holder.getBoundingClientRect().left;
          yt.style.left =
            Math.max(0, Math.round(minLeft - hl) - AXIS_GAP - AXIS_TITLE_H) + "px";
        }

    }
    // legend that never truncates the colour labels
    function fullLegend() { return { enabled: false }; }

    /* ---------- chart builders ---------- */
    function buildBar(horizontal) {
      var data = state.rows.map(function (r) { return { group: r.label, value: rowVal(r, 0) }; });
      var valueAxis = { mapsTo: "value" };
      var labelAxis = { mapsTo: "group", scaleType: "labels" };
      var options = {
        axes: applyAxisTitles(horizontal
          ? { left: labelAxis, bottom: valueAxis }
          : { left: valueAxis, bottom: labelAxis }),
        legend: { enabled: false },
        color: { scale: colorScaleByLabel() },
        toolbar: { enabled: false },
        height: "460px",
        grid: { x: { enabled: false } }
      };
      return { Cls: window.Charts.SimpleBarChart, config: { data: data, options: options } };
    }

    function buildLineOrArea(isArea) {
      var data = state.rows.map(function (r) {
        return { group: "Series", key: r.label, value: rowVal(r, 0) };
      });
      var options = {
        axes: applyAxisTitles({
          bottom: { mapsTo: "key", scaleType: "labels" },
          left: { mapsTo: "value" }
        }),
        legend: { enabled: false },
        color: { scale: { "Series": ORANGE } },
        points: { radius: 4 },
        toolbar: { enabled: false },
        height: "460px"
      };
      var Cls = isArea ? window.Charts.AreaChart : window.Charts.LineChart;
      return { Cls: Cls, config: { data: data, options: options } };
    }

    // comparison colour scale for however many sets are active
    function seriesColorScale() {
      var scale = {};
      for (var i = 0; i < nSeries(); i++) scale[sName(i)] = seriesColor(i);
      return scale;
    }
    // flat rows: one entry per (series, category)
    function seriesData() {
      var data = [], n = nSeries();
      state.rows.forEach(function (r) {
        for (var i = 0; i < n; i++) data.push({ group: sName(i), key: r.label, value: rowVal(r, i) });
      });
      return data;
    }

    // grouped bar: two bars per category
    function buildGroupedBar(horizontal) {
      var data = seriesData();
      var valueAxis = { mapsTo: "value" };
      var labelAxis = { mapsTo: "key", scaleType: "labels" };
      var options = {
        axes: applyAxisTitles(horizontal
          ? { left: labelAxis, bottom: valueAxis }
          : { left: valueAxis, bottom: labelAxis }),
        legend: fullLegend(),
        color: { scale: seriesColorScale() },
        toolbar: { enabled: false },
        height: "460px",
        grid: { x: { enabled: false } }
      };
      return { Cls: window.Charts.GroupedBarChart, config: { data: data, options: options } };
    }

    // two-line comparison
    function buildLineCompare() {
      var data = seriesData();
      var options = {
        axes: applyAxisTitles({
          bottom: { mapsTo: "key", scaleType: "labels" },
          left: { mapsTo: "value" }
        }),
        legend: fullLegend(),
        color: { scale: seriesColorScale() },
        points: { radius: 4 },
        toolbar: { enabled: false },
        height: "460px"
      };
      return { Cls: window.Charts.LineChart, config: { data: data, options: options } };
    }

    /* Pie & donut are hand-drawn as clean SVG (Carbon's radial charts do not
       rasterize reliably for PNG export). Full brand control, always exports. */
    var SVGNS = "http://www.w3.org/2000/svg";
    function svgEl(tag, attrs) {
      var e = document.createElementNS(SVGNS, tag);
      for (var k in attrs) { if (attrs.hasOwnProperty(k)) e.setAttribute(k, attrs[k]); }
      return e;
    }
    function renderPieDonut(holder, isDonut) {
      /* Geometry note: percentage labels sit at (R + LABEL_GAP) from the centre, so the
         canvas must clear that radius PLUS half a line of text on every side, or the
         top/bottom labels clip. cy and H are derived from R so this can't drift again. */
      var W = 840, R = 168, LABEL_GAP = 26, LABEL_HALF = 12, PAD = 4;
      var cx = W / 2;
      var cy = R + LABEL_GAP + LABEL_HALF + PAD;          /* 210 */
      var H  = cy + R + LABEL_GAP + LABEL_HALF + PAD;     /* 420 */
      var innerR = isDonut ? R * 0.60 : 0;
      var total = 0;
      state.rows.forEach(function (r) { var v = rowVal(r, 0); if (v > 0) total += v; });
      if (total <= 0) total = 1;

      var svg = svgEl("svg", { width: W, height: H, viewBox: "0 0 " + W + " " + H });
      var a0 = -Math.PI / 2;
      state.rows.forEach(function (r, i) {
        var v = rowVal(r, 0);
        if (v <= 0) return;
        var frac = v / total, a1 = a0 + frac * 2 * Math.PI, mid = (a0 + a1) / 2;
        var large = (a1 - a0) > Math.PI ? 1 : 0;
        var color = (i === state.highlight) ? SIGNAL_BLUE : RAMP[i % RAMP.length];
        var xo0 = cx + R * Math.cos(a0), yo0 = cy + R * Math.sin(a0);
        var xo1 = cx + R * Math.cos(a1), yo1 = cy + R * Math.sin(a1);
        var d;
        if (innerR > 0) {
          var xi1 = cx + innerR * Math.cos(a1), yi1 = cy + innerR * Math.sin(a1);
          var xi0 = cx + innerR * Math.cos(a0), yi0 = cy + innerR * Math.sin(a0);
          d = "M " + xo0 + " " + yo0 + " A " + R + " " + R + " 0 " + large + " 1 " + xo1 + " " + yo1 +
              " L " + xi1 + " " + yi1 + " A " + innerR + " " + innerR + " 0 " + large + " 0 " + xi0 + " " + yi0 + " Z";
        } else {
          d = "M " + cx + " " + cy + " L " + xo0 + " " + yo0 +
              " A " + R + " " + R + " 0 " + large + " 1 " + xo1 + " " + yo1 + " Z";
        }
        svg.appendChild(svgEl("path", { d: d, fill: color, stroke: "#F3F3F3", "stroke-width": "2" }));
        // percentage label just outside the ring
        var lx = cx + (R + 26) * Math.cos(mid), ly = cy + (R + 26) * Math.sin(mid);
        var t = svgEl("text", { x: lx, y: ly, "text-anchor": "middle", "dominant-baseline": "middle",
                                "font-family": "Arial, sans-serif", "font-size": "16", fill: "#404040" });
        t.textContent = Math.round(frac * 100) + "%";
        svg.appendChild(t);
        a0 = a1;
      });
      if (isDonut) {
        var num = svgEl("text", { x: cx, y: cy, "text-anchor": "middle", "dominant-baseline": "central",
                                  "font-family": "'Merriweather', serif", "font-size": "46", fill: "#404040" });
        num.textContent = String(Math.round(total * 100) / 100);
        svg.appendChild(num);
      }
      holder.appendChild(svg);

      // legend as HTML (exports reliably, easy to center)
      var leg = document.createElement("div");
      leg.style.cssText = "display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;margin-top:6px;" +
                          "font-family:Arial,sans-serif;font-size:16px;color:#404040;";
      state.rows.forEach(function (r, i) {
        var v = rowVal(r, 0); if (v <= 0) return;
        var item = document.createElement("span");
        item.style.cssText = "display:inline-flex;align-items:center;gap:6px;";
        var sw = document.createElement("span");
        sw.style.cssText = "width:12px;height:12px;border-radius:2px;flex:none;background:" +
                           ((i === state.highlight) ? SIGNAL_BLUE : RAMP[i % RAMP.length]) + ";";
        item.appendChild(sw);
        item.appendChild(document.createTextNode(r.label || ""));
        leg.appendChild(item);
      });
      holder.appendChild(leg);
    }

    /* ---------- stat callout: up to three stats in a row ---------- */
    function renderStats(container) {
      container.innerHTML = "";
      var items = state.rows.slice(0, 3);
      if (items.length === 0) items = [{ label: "", value: "" }];
      var n = items.length;
      var bigSize = n <= 1 ? 140 : (n === 2 ? 104 : 78);
      var labelSize = n <= 1 ? 20 : 18;   /* 16px floor for all labels (mobile legibility) */
      items.forEach(function (r, i) {
        var tile = document.createElement("div");
        tile.className = "stat-tile" + (n === 1 ? " solo" : "");
        var big = document.createElement("p");
        big.className = "stat-big";
        big.style.fontSize = bigSize + "px";
        big.style.color = (state.highlight === i) ? SIGNAL_BLUE : STAT_RAMP[i % STAT_RAMP.length];
        var sv = (r.vals || [])[0];
        big.textContent = (sv === "" || sv == null) ? "—" : sv;
        var lab = document.createElement("p");
        lab.className = "stat-label";
        lab.style.fontSize = labelSize + "px";
        lab.textContent = r.label || "";
        tile.appendChild(big); tile.appendChild(lab);
        container.appendChild(tile);
      });
    }

    /* ---------- source line: colour any URL Progress Orange (reads as a link) ---------- */
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function linkifySource(text) {
      return escapeHtml(text).replace(
        /((?:https?:\/\/|www\.)[^\s]+|[a-z0-9.\-]+\.(?:com|org|net|io|co|gov|edu|us|uk|ai)(?:\/[^\s]*)?)/gi,
        function (m) { return '<span style="color:#EE4B22;text-decoration:underline;">' + m + "</span>"; }
      );
    }

    /* ---------- master render ---------- */
    function render() {
      // text bits
      $("c-cat").textContent = state.cat;
      $("c-cat").style.display = state.cat ? "block" : "none";
      $("c-title").textContent = state.title;
      $("c-title").style.display = state.title ? "block" : "none";
      $("c-subtitle").textContent = state.subtitle;
      $("c-subtitle").style.display = state.subtitle ? "block" : "none";
      $("c-source").innerHTML = state.source ? linkifySource(state.source) : "";
      $("c-wordmark").className = "wordmark" + (state.wordmark ? "" : " hidden");

      var holder = $("chart-holder");
      var stat = $("stat");

      // tear down previous chart. NOTE: Carbon's destroy() removes the node it
      // was mounted on, so we mount into a throwaway child and keep #chart-holder stable.
      if (chart && chart.destroy) { try { chart.destroy(); } catch (e) {} }
      chart = null;
      holder.innerHTML = "";
      holder.style.paddingLeft = "";   // reset gutter from any previous cartesian render

      if (state.type === "stat") {
        holder.style.display = "none";
        stat.style.display = "flex";
        renderStats(stat);
        return;
      }

      stat.style.display = "none";
      holder.style.display = "block";
      holder.style.position = "relative";

      if (state.type === "pie" || state.type === "donut") {
        holder.style.paddingTop = "8px";
        renderPieDonut(holder, state.type === "donut");
        return;
      }
      holder.style.paddingTop = "";

      var cmp = comparing();
      var built;
      if (state.type === "bar") built = cmp ? buildGroupedBar(false) : buildBar(false);
      else if (state.type === "barh") built = cmp ? buildGroupedBar(true) : buildBar(true);
      else if (state.type === "line") built = cmp ? buildLineCompare() : buildLineOrArea(false);
      else if (state.type === "area") built = buildLineOrArea(true);

      if (built && built.Cls) {
        var TFONT = "400 16px Arial, sans-serif";
        // gutter = title band + the same 20px gap used under the horizontal title
        var padL = state.yAxis ? (AXIS_TITLE_H + AXIS_GAP) : 0;
        holder.style.paddingLeft = padL + "px";

        // chart in normal flow at its natural height
        var mount = document.createElement("div");
        mount.style.height = "460px";
        holder.appendChild(mount);
        chart = new built.Cls(mount, built.config);

        // vertical axis title — rotated, in the left gutter, centred on the plot
        if (state.yAxis) {
          var yt = document.createElement("div");
          yt.className = "ov-ytitle";
          yt.style.cssText = "position:absolute;left:0;top:0;height:460px;width:" + AXIS_TITLE_H +
            "px;display:flex;align-items:center;justify-content:center;";
          var ys = document.createElement("span");
          ys.textContent = state.yAxis.toUpperCase();
          ys.style.cssText = "transform:rotate(-90deg);white-space:nowrap;font:" + TFONT +
            ";letter-spacing:0.08em;color:#525252;";
          yt.appendChild(ys);
          holder.appendChild(yt);
        }

        // horizontal axis title — below the chart, 20px clear of it
        if (state.xAxis) {
          var xt = document.createElement("div");
          xt.className = "ov-xtitle";
          xt.textContent = state.xAxis.toUpperCase();
          xt.style.cssText = "margin-top:" + AXIS_GAP + "px;text-align:center;font:" + TFONT +
            ";letter-spacing:0.08em;color:#525252;";
          holder.appendChild(xt);
        }

        // comparison legend — below, left-aligned to the plot's left edge
        if (comparing()) {
          var lg = document.createElement("div");
          lg.className = "ov-legend";
          lg.style.cssText = "margin-top:" + (state.xAxis ? 28 : 32) +
            "px;display:flex;align-items:center;flex-wrap:wrap;gap:6px 18px;" +
            "font:400 16px Arial,sans-serif;color:#404040;";
          for (var si = 0; si < nSeries(); si++) {
            var item = document.createElement("span");
            item.style.cssText = "display:inline-flex;align-items:center;gap:6px;";
            var sw = document.createElement("span");
            sw.style.cssText = "width:12px;height:12px;border-radius:2px;flex:none;background:" +
              seriesColor(si) + ";";
            item.appendChild(sw);
            item.appendChild(document.createTextNode(sName(si)));
            lg.appendChild(item);
          }
          holder.appendChild(lg);
        }
        // Carbon renders asynchronously, so align once now and again shortly after —
        // a single pass can run before the tick labels exist.
        requestAnimationFrame(function () { alignCartesianOverlays(holder); });
        [60, 200, 500].forEach(function (ms) {
          setTimeout(function () { alignCartesianOverlays(holder); }, ms);
        });
      }
      // card height changes with chart type/content — re-fit so the reserved
      // space stays correct (matters on mobile, where the card is scaled down)
      requestAnimationFrame(fitPreview);
      setTimeout(fitPreview, 250);
    }

    /* ---------- highlight availability ---------- */
    function highlightAllowed() {
      return ["bar", "barh", "pie", "donut", "stat"].indexOf(state.type) !== -1;
    }

    /* ---------- comparison controls visibility ---------- */
    function updateCompareUI() {
      $("compare-field").style.display = compareAllowed() ? "" : "none";
      $("series-names").style.display = comparing() ? "block" : "none";
      $("data-hint").style.display = comparing() ? "none" : "";
      for (var i = 1; i <= 4; i++) {
        $("srow" + i).style.display = (comparing() && i <= seriesCount()) ? "" : "none";
        $("hl-series" + i).className = "hl" + (state.seriesHighlight === i - 1 ? " on" : "");
      }
      // axis labels only apply to cartesian charts
      $("axis-field").style.display =
        (["bar", "barh", "line", "area"].indexOf(state.type) !== -1) ? "" : "none";
    }

    /* ---------- paste parsing ---------- */
    // Accepts a real spreadsheet paste: tab-separated cells, 1,234-style thousands,
    // $ / % / (negatives), a header row, and Total/Average rows.
    function parseNum(v) {
      if (v == null) return NaN;
      var t = String(v).trim();
      if (!t) return NaN;
      var neg = /^\(.*\)$/.test(t);
      t = t.replace(/^\(|\)$/g, "").trim();
      t = t.replace(/[$£€%\s,]/g, "");
      if (!/^[+-]?\d*\.?\d+$/.test(t)) return NaN;   // "Q1" must NOT parse as 1
      var n = parseFloat(t);
      if (isNaN(n)) return NaN;
      return neg ? -n : n;
    }
    function splitCells(line) {
      if (line.indexOf("\t") !== -1) {
        return line.split("\t").map(function (c) { return c.trim(); });
      }
      // comma fallback: rejoin thousands groups so "42,000" stays one number
      var parts = line.split(",").map(function (c) { return c.trim(); }), out = [];
      parts.forEach(function (p) {
        var prev = out[out.length - 1];
        if (prev !== undefined && /^\d{3}$/.test(p) && /^[+-]?[\d.]+$/.test(prev)) {
          out[out.length - 1] = prev + p;
        } else out.push(p);
      });
      return out;
    }

    function applyPaste() {
      var note = $("paste-note");
      var raw = $("in-paste").value.replace(/\u00a0/g, " ").replace(/\s+$/, "");
      if (!raw.trim()) { note.textContent = ""; return; }

      var rows = raw.split(/\r?\n/).map(splitCells).filter(function (c) {
        return c.some(function (x) { return x !== ""; });
      });
      if (!rows.length) { note.textContent = "Nothing readable in that paste."; return; }

      // header row = first row whose later cells aren't numbers
      var headers = null;
      if (rows.length > 1) {
        var firstNums = rows[0].slice(1).filter(function (c) { return !isNaN(parseNum(c)); }).length;
        if (firstNums === 0) headers = rows.shift();
      }

      var skipped = 0, out = [], maxCols = 0;
      rows.forEach(function (c) {
        var label = (c[0] || "").trim();
        if (!label) return;
        if (/^(total|totals|grand total|sum|subtotal|average|avg|mean)\b/i.test(label)) { skipped++; return; }
        var nums = [];
        for (var i = 1; i < c.length; i++) {
          var n = parseNum(c[i]);
          if (!isNaN(n)) nums.push(n);
        }
        if (!nums.length) return;
        maxCols = Math.max(maxCols, nums.length);
        out.push({ label: label, vals: [nums[0] || 0, nums[1] || 0, nums[2] || 0, nums[3] || 0] });
      });

      if (!out.length) { note.textContent = "Couldn't find any label + number rows in that paste."; return; }

      state.rows = out;
      state.highlight = -1;

      var used = Math.min(maxCols, MAX_SERIES);
      var msg = [out.length + " row" + (out.length === 1 ? "" : "s")];

      if (used > 1 && compareAllowed()) {
        state.seriesCount = used;
        $("in-seriescount").value = String(used);
        msg.push(used + " data sets");
      } else if (used > 1) {
        msg.push("first number column only (" + state.type + " charts show one set)");
      }
      if (headers) {
        for (var h = 0; h < MAX_SERIES; h++) {
          var hv = (headers[h + 1] || "").trim();
          if (hv) state.seriesNames[h] = hv;
          $("in-series" + (h + 1)).value = state.seriesNames[h] || "";
        }
        if (!state.xAxis && headers[0]) {
          state.xAxis = headers[0].trim();
          $("in-xaxis").value = state.xAxis;
        }
        msg.push("named from the header row");
      }
      if (maxCols > MAX_SERIES) msg.push("ignored " + (maxCols - MAX_SERIES) + " extra column(s)");
      if (skipped) msg.push("skipped " + skipped + " total/average row" + (skipped === 1 ? "" : "s"));

      note.textContent = msg.join(" · ") + ".";
      updateCompareUI(); renderRows(); render();
    }

    /* Carbon styles its SVG via an external stylesheet + CSS variables, which do
       NOT survive rasterization (the plot area goes black in the PNG). Fix: copy
       each SVG node's *computed* presentation styles onto the node as inline
       attributes so concrete values travel into the export. */
    function inlineChartStyles(root) {
      var props = ["fill", "fill-opacity", "stroke", "stroke-width",
                   "stroke-opacity", "stroke-dasharray", "opacity",
                   "font-family", "font-size", "font-weight", "text-anchor"];
      var nodes = root.querySelectorAll("svg, svg *");
      Array.prototype.forEach.call(nodes, function (el) {
        var cs = window.getComputedStyle(el);
        var extra = "";
        props.forEach(function (p) {
          var v = cs.getPropertyValue(p);
          if (v && v !== "" && v !== "normal") { extra += p + ":" + v + ";"; }
        });
        el.setAttribute("style", (el.getAttribute("style") || "") + extra);
      });
    }

    /* ---------- SVG export ----------
       Builds a REAL vector SVG (native <text>/<rect>/<path>) by walking the card,
       rather than wrapping HTML in a <foreignObject> — foreignObject SVGs look fine
       in a browser but import as nothing in Figma/Illustrator. */
    var _mctx = null;
    function svgEsc(t) {
      return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function baselineFor(cs, top, height, sample) {
      if (!_mctx) _mctx = document.createElement("canvas").getContext("2d");
      var fs = parseFloat(cs.fontSize) || 12;
      var asc = fs * 0.8, desc = fs * 0.2;
      try {
        _mctx.font = cs.fontStyle + " " + cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
        var m = _mctx.measureText(sample || "Mg");
        if (m.fontBoundingBoxAscent) {
          asc = m.fontBoundingBoxAscent;
          desc = m.fontBoundingBoxDescent || desc;
        }
      } catch (e) {}
      return top + (height - (asc + desc)) / 2 + asc;
    }
    function rotationOf(cs) {
      var t = cs.transform;
      if (!t || t === "none") return 0;
      var m = t.match(/matrix\(([^)]+)\)/);
      if (!m) return 0;
      var p = m[1].split(",").map(parseFloat);
      return Math.round(Math.atan2(p[1], p[0]) * 180 / Math.PI);
    }
    // Illustrator (and some other tools) ignore presentation properties that live
    // only in a CSS `style` string — notably text-anchor, which is what right-aligns
    // the axis numbers. Re-state them as real XML attributes so they always apply.
    function svgPresentationAttrs(root) {
      var props = ["fill", "fill-opacity", "stroke", "stroke-width", "stroke-opacity",
                   "opacity", "font-family", "font-size", "font-weight", "text-anchor"];
      Array.prototype.forEach.call(root.querySelectorAll("svg *"), function (el) {
        var cs = window.getComputedStyle(el);
        props.forEach(function (p) {
          var v = cs.getPropertyValue(p);
          if (v && v !== "" && v !== "normal" && v !== "auto") {
            try { el.setAttribute(p, v); } catch (e) {}
          }
        });
      });
    }
    function cardToSvg() {
      var card = $("card"), holder = $("chart-holder");
      if (card.querySelector("svg")) {
        alignCartesianOverlays(holder);
        inlineChartStyles(holder);   // same fix the PNG needs: concrete fills
        svgPresentationAttrs(holder);
      }
      var cb = card.getBoundingClientRect();
      var W = Math.round(cb.width), H = Math.round(cb.height);
      var parts = ['<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#F3F3F3"/>'];

      function emitText(node, cs) {
        var txt = node.textContent.replace(/\s+/g, " ").trim();
        if (!txt) return;
        // honour CSS text-transform — the DOM text is untransformed
        var tt = cs.textTransform;
        if (tt === "uppercase") txt = txt.toUpperCase();
        else if (tt === "lowercase") txt = txt.toLowerCase();
        else if (tt === "capitalize") txt = txt.replace(/\b\w/g, function (m) { return m.toUpperCase(); });
        var range = document.createRange();
        range.selectNodeContents(node);
        var r = range.getBoundingClientRect();
        if (!r.width && !r.height) return;
        var ang = rotationOf(cs);
        var ls = (cs.letterSpacing && cs.letterSpacing !== "normal")
          ? ' letter-spacing="' + parseFloat(cs.letterSpacing) + '"' : "";
        var common = ' font-family="' + svgEsc(cs.fontFamily) + '" font-size="' +
          parseFloat(cs.fontSize) + '" font-weight="' + cs.fontWeight +
          '" fill="' + cs.color + '"' + ls;
        var x, y, extra = "";
        if (ang) {
          x = r.left + r.width / 2 - cb.left;
          y = r.top + r.height / 2 - cb.top;
          extra = ' text-anchor="middle" dominant-baseline="central" transform="rotate(' +
            ang + " " + x.toFixed(1) + " " + y.toFixed(1) + ')"';
        } else {
          x = r.left - cb.left;
          y = baselineFor(cs, r.top - cb.top, r.height, txt);
        }
        parts.push('<text x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '"' +
          common + extra + ">" + svgEsc(txt) + "</text>");
      }

      (function walk(el) {
        var cs = window.getComputedStyle(el);
        if (cs.display === "none" || cs.visibility === "hidden" || parseFloat(cs.opacity) === 0) return;
        var tag = el.tagName.toLowerCase();
        var r = el.getBoundingClientRect();

        if (tag === "svg") {                       // native chart art — keep as vectors
          var c = el.cloneNode(true);
          c.setAttribute("xmlns", "http://www.w3.org/2000/svg");
          c.setAttribute("width", Math.round(r.width));
          c.setAttribute("height", Math.round(r.height));
          parts.push('<g transform="translate(' + (r.left - cb.left).toFixed(1) + "," +
            (r.top - cb.top).toFixed(1) + ')">' + c.outerHTML + "</g>");
          return;
        }
        if (tag === "img") return;

        var bg = cs.backgroundColor;
        if (el !== card && bg && bg !== "rgba(0, 0, 0, 0)" && bg !== "transparent" &&
            r.width > 0 && r.height > 0) {
          parts.push('<rect x="' + (r.left - cb.left).toFixed(1) + '" y="' +
            (r.top - cb.top).toFixed(1) + '" width="' + r.width.toFixed(1) + '" height="' +
            r.height.toFixed(1) + '" rx="' + (parseFloat(cs.borderRadius) || 0) +
            '" fill="' + bg + '"/>');
        }

        Array.prototype.forEach.call(el.childNodes, function (n) {
          if (n.nodeType === 3) emitText(n, cs);
        });
        Array.prototype.forEach.call(el.children, walk);
      })(card);

      return '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H +
        '" viewBox="0 0 ' + W + " " + H + '">' + parts.join("") + "</svg>";
    }

    function downloadSvg() {
      var note = $("export-note");
      note.textContent = "Building SVG…";
      var fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
      fontsReady.then(function () {
        var svg = cardToSvg();
        var blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        var safe = (state.title || "gather-signal-infographic")
          .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
        a.download = (safe || "gather-signal-infographic") + ".svg";
        a.href = url;
        a.click();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        note.textContent = "Downloaded SVG.";
        setTimeout(function () { note.textContent = ""; }, 2500);
      }).catch(function (e) {
        note.textContent = "SVG export failed: " + (e && e.message ? e.message : e);
      });
    }

    /* ---------- PNG export ---------- */
    function download() {
      var note = $("export-note");
      var card = $("card");
      note.textContent = "Rendering PNG…";
      // fonts must be ready before rasterizing
      var fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
      fontsReady.then(function () {
        var svg = card.querySelector("svg");
        if (svg) { alignCartesianOverlays($("chart-holder")); inlineChartStyles($("chart-holder")); }
        return window.htmlToImage.toPng(card, {
          pixelRatio: 2,
          backgroundColor: "#F3F3F3",
          cacheBust: true,
          filter: function (node) {
            // never let a broken/unloaded <img> (e.g. a missing wordmark) break the export
            if (node && node.tagName === "IMG" && (!node.complete || node.naturalWidth === 0)) return false;
            return true;
          }
        });
      }).then(function (dataUrl) {
        var a = document.createElement("a");
        var safe = (state.title || "gather-signal-infographic")
          .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
        a.download = (safe || "gather-signal-infographic") + ".png";
        a.href = dataUrl;
        a.click();
        note.textContent = "Downloaded.";
        setTimeout(function () { note.textContent = ""; }, 2500);
      }).catch(function (err) {
        note.textContent = "Export failed: " + (err && err.message ? err.message : err);
      });
    }

    /* ---------- responsive scale of preview ---------- */
    function fitPreview() {
      var scaler = $("scaler");
      var stage = scaler.parentNode;
      // Use the stage's real inner width (its padding changes at the mobile
      // breakpoint, so a hard-coded inset would go negative on a phone and
      // scale the card to nothing).
      var cs = window.getComputedStyle(stage);
      var avail = stage.clientWidth
                - parseFloat(cs.paddingLeft || 0)
                - parseFloat(cs.paddingRight || 0);
      if (!avail || avail < 1) avail = 1;
      var scale = Math.min(1, avail / 1000);
      scaler.style.transform = "scale(" + scale + ")";
      // transform doesn't change layout size, so reserve the scaled height —
      // otherwise the stage keeps the full 1000px-tall footprint and leaves a
      // large empty gap above the controls on mobile.
      var card = $("card");
      if (card) {
        scaler.style.height = (card.offsetHeight * scale) + "px";
        scaler.style.width = (1000 * scale) + "px";
      }
    }

    /* ---------- wire up ---------- */
    function init() {
      // type buttons
      Array.prototype.forEach.call($("type-grid").children, function (btn) {
        btn.onclick = function () {
          Array.prototype.forEach.call($("type-grid").children, function (b) { b.classList.remove("active"); });
          btn.classList.add("active");
          state.type = btn.dataset.type;
          if (!highlightAllowed()) state.highlight = -1;
          updateCompareUI();
          renderRows(); render();
        };
      });

      // comparison controls
      $("in-seriescount").onchange = function () {
        state.seriesCount = parseInt(this.value, 10) || 1;
        if (state.seriesCount > 1) state.highlight = -1;
        if (state.seriesHighlight >= state.seriesCount) state.seriesHighlight = -1;
        updateCompareUI(); renderRows(); render();
      };
      for (var si = 1; si <= 4; si++) {
        (function (si) {
          var el = $("in-series" + si);
          el.value = state.seriesNames[si - 1] || "";
          el.oninput = function () { state.seriesNames[si - 1] = this.value; render(); };
          $("hl-series" + si).onclick = function () {
            state.seriesHighlight = (state.seriesHighlight === si - 1) ? -1 : si - 1;
            updateCompareUI(); render();
          };
        })(si);
      }

      $("in-cat").oninput = function () { state.cat = this.value; render(); };
      $("in-title").oninput = function () { state.title = this.value; render(); };
      $("in-subtitle").oninput = function () { state.subtitle = this.value; render(); };
      $("in-xaxis").oninput = function () { state.xAxis = this.value; render(); };
      $("in-yaxis").oninput = function () { state.yAxis = this.value; render(); };
      $("in-source").oninput = function () { state.source = this.value; render(); };
      /* wordmark toggle removed — the wordmark is always stamped on export */

      $("add-row").onclick = function () {
        state.rows.push({ label: "New", vals: [0, 0, 0, 0] }); renderRows(); render();
      };
      $("apply-paste").onclick = applyPaste;
      $("download").onclick = download;
      $("download-svg").onclick = downloadSvg;

      // seed inputs from state
      $("in-title").value = state.title;

      updateCompareUI();
      renderRows();
      render();
      fitPreview();
      window.addEventListener("resize", fitPreview);

    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else { init(); }
  })();
  </script>
</body>
</html>
